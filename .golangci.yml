version: "2"

run:
  # internal/waf does not compile without it (ADR-0008)
  build-tags:
    - no_fs_access

linters:
  default: standard
  enable:
    - bodyclose
    - errname
    - errorlint
    - gocritic
    - gosec
    - intrange
    - misspell
    - modernize
    - noctx
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    modernize:
      disable:
        # The SDDL builders keep "+=": easier to check against the access
        # lists they build (QR-09)
        - stringsbuilder
    revive:
      # Only these rules; revive's defaults overlap staticcheck (QR-10)
      rules:
        - name: exported
        - name: package-comments
        - name: redefines-builtin-id

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/TheAlsaadi/SoireeHost
