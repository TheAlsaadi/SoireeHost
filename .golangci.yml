version: "2"

run:
  # internal/waf does not compile without it (ADR-0008)
  build-tags:
    - no_fs_access

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - unconvert
    - usestdlibvars
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/TheAlsaadi/SoireeHost
