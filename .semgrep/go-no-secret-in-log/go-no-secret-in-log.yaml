rules:
  - id: go-no-secret-in-log
    languages: [go]
    severity: HIGH
    mode: taint
    message: >-
      S-40: a secret (a value from the secrets store, SecretSetParams.Value or
      TunnelPlan.Token) reaches $SINK, which writes it to a log, an error, the
      event log or the audit log. Log the secret's name or whether it is set,
      never its value.
    metadata:
      requirement: S-40
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      confidence: MEDIUM
    options:
      # A comparison such as secret != nil does not reveal the secret.
      taint_assume_safe_booleans: true
    pattern-sources:
      # Go package names are matched as written, so each source is pinned to
      # the project's own package by its import path.
      - patterns:
          - pattern-inside: |
              import "github.com/TheAlsaadi/SoireeHost/internal/secrets"
              ...
          # Only the value is secret, not the error returned beside it, so the
          # source is the first variable assigned. Semgrep reads
          # `var v, err = f()` as `var v = f()` plus `var err`, so there the
          # call itself is the source.
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: $VALUE, $ERR := $GET
                      - pattern: $VALUE, $ERR = $GET
                  - focus-metavariable: $VALUE
              - patterns:
                  - pattern: var $VALUE = $GET
                  - focus-metavariable: $GET
          - metavariable-pattern:
              metavariable: $GET
              pattern-either:
                - pattern: '($STORE : *secrets.Store).Get(...)'
                # Type inference does not reach struct fields declared in
                # another file (s.secrets), so also match a Get by a secrets
                # name.
                - pattern: $STORE.Get(secrets.$NAME)
      - patterns:
          - pattern-inside: |
              import "github.com/TheAlsaadi/SoireeHost/internal/ipc"
              ...
          - pattern-either:
              - pattern: '($P : ipc.SecretSetParams).Value'
              - pattern: '($P : *ipc.SecretSetParams).Value'
              - pattern: '($M : ipc.TunnelPlan).Token'
              - pattern: '($M : *ipc.TunnelPlan).Token'
    pattern-sanitizers:
      # A secret's length reveals nothing about its value.
      - pattern: len(...)
      # The secrets store's Set returns an error that never contains the
      # value (internal/secrets). Without this, taint flows through the call
      # into that error.
      - patterns:
          - pattern-inside: |
              import "github.com/TheAlsaadi/SoireeHost/internal/secrets"
              ...
          - pattern-either:
              - pattern: '($STORE : *secrets.Store).Set($NAME, $VALUE)'
              - pattern: $SUP.secrets.Set($NAME, $VALUE)
    pattern-sinks:
      - patterns:
          - pattern: $SINK(...)
          - metavariable-pattern:
              metavariable: $SINK
              pattern-either:
                - patterns:
                    - pattern: fmt.$FUNC
                    - metavariable-regex:
                        metavariable: $FUNC
                        regex: ^(Print|Println|Printf|Fprint|Fprintln|Fprintf|Errorf|Sprintf)$
                - pattern: log.$FUNC
                - pattern: errors.New
                # zap and slog loggers, *log.Logger, the Windows event log
                # (elog.Info/Warning/Error) and the like, on any receiver.
                - patterns:
                    - pattern: $LOGGER.$METHOD
                    - metavariable-regex:
                        metavariable: $METHOD
                        regex: ^(Debug|Info|Warn|Warning|Error|DPanic|Panic|Fatal|Print|Log)(f|w|ln|Context)?$
      # The audit log, and the supervisor's wrapper around it.
      - patterns:
          - pattern-inside: |
              import "github.com/TheAlsaadi/SoireeHost/internal/audit"
              ...
          - pattern: $SINK($ACTOR, $ACTION, $DETAIL)
          - pattern-either:
              - pattern: $AUDIT.Append($ACTOR, $ACTION, $DETAIL)
              # The receiver's type is not inferred, so scope by the method.
              - patterns:
                  - pattern-inside: |
                      func ($SUP *Supervisor) $METHOD(...) {
                        ...
                      }
                  - pattern: $SUP.record($ACTOR, $ACTION, $DETAIL)
