# OWASP Core Rule Set pinned for embedding (S-14, S-65, S-71; ADR-0008).
# Source: https://github.com/coreruleset/coreruleset/releases/tag/v4.30.0
# SHA-256 matches the asset digest GitHub reports for the release (checked 2026-11-15).
# The archive's .asc signature was verified on 2026-11-15 with the CRS release key,
# fingerprint 36006F0E0BA167832158821138EEACA1AB8A6E72 (published in the release's docs/INSTALL.md).
# build/check-crs.ps1 downloads the archive, refuses it unless the hash matches, and checks
# that internal/waf/crs holds exactly the files below, byte for byte.
# internal/waf/crs.go holds the same version; TestCRSVersionMatchesLock keeps them equal.
