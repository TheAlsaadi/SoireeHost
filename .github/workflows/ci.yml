# Build, lint, test and scan on every push and pull request; deeper runs nightly.
# Every action is pinned to a full commit SHA (S-72); the tag is in the comment.
# Pull-request builds get no secrets and a read-only token (S-72).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      phone_minutes:
        description: "Phase 3 phone check: keep a quick share link up for this many minutes (0 = off, at most 30). The link is printed as a notice on the run page."
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  NODE_VERSION: "26"
  WAILS_VERSION: v3.1.0
  GOLANGCI_LINT_VERSION: v2.15.0
  STATICCHECK_VERSION: v0.8.2
  GOSEC_VERSION: v2.30.0
  GOVULNCHECK_VERSION: v1.9.0
  GITLEAKS_VERSION: v8.30.1
  SEMGREP_VERSION: "1.185.0"

jobs:
  go:
    name: Go checks
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify module checksums
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: Tests with race detector
        # The race detector needs cgo; release builds stay CGO_ENABLED=0.
        # On failure the relevant lines are also published as an annotation,
        # which GitHub shows without signing in (job logs need a sign-in).
        env:
          CGO_ENABLED: "1"
        shell: pwsh
        run: |
          $out = go test -race -count=1 ./... 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) {
            $lines = $out -split "`r?`n" | Where-Object { $_ -match 'FAIL|panic|WARNING: DATA RACE|error|cannot|undefined|--- |\.go:\d+' } | Select-Object -First 40
            $msg = ($lines -join '%0A') -replace '::', ': :'
            Write-Output "::error title=go test -race failed::$msg"
            exit $code
          }
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }} ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }} -quiet -exclude-dir=.semgrep ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  frontend:
    name: Frontend checks
    runs-on: windows-2025
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts --no-fund
      - name: Type check
        run: npm run check
      - name: Lint (includes S-34 rules)
        run: npm run lint
      - name: Tests
        run: npm test
      - name: npm audit
        # Low-severity findings are reviewed in docs/DEPENDENCIES.md.
        run: npm audit --audit-level=moderate

  build:
    name: Build soireehost.exe
    runs-on: windows-2025
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
        env:
          GOFLAGS: ""
      - name: Build (with the pinned cloudflared, S-71)
        shell: pwsh
        run: ./build/build.ps1 -SkipChecks -Cloudflared
      - name: Committed bindings match the Go code
        run: git diff --exit-code -- frontend/bindings
      - name: Binary has ASLR, DEP and high-entropy VA (S-24)
        run: go run ./build/pecheck bin/soireehost.exe

  secrets:
    name: Secret scan
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gitleaks (full history)
        env:
          GOFLAGS: ""
        run: |
          go install github.com/zricethezav/gitleaks/v8@${{ env.GITLEAKS_VERSION }}
          gitleaks git --redact --no-banner -v .

  semgrep:
    # The project's own rules in .semgrep (plan section 10): S-01, S-34, S-40,
    # R-14 and CLAUDE.md rule 6. Semgrep runs offline with metrics off; no
    # login, token or cloud platform is used.
    name: Semgrep (project rules)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Semgrep
        # pipx ships on the runner image, so no extra action is needed (the
        # repository allow list does not include actions/setup-python).
        run: pipx install semgrep==${{ env.SEMGREP_VERSION }}
      - name: Rule tests
        run: semgrep --test --metrics=off .semgrep
      - name: Scan with the project rules
        # The rule folders hold the rules' own test cases, which are meant to
        # match, so they are left out of the scan.
        run: semgrep scan --metrics=off --config .semgrep --error --exclude=.semgrep

  isolation:
    # Installs the three services on this throwaway runner (which has
    # administrator rights) and checks isolation from the outside: plan
    # Phase 2, docs/TEST_PLAN.md "Isolation". Never run on a developer PC.
    name: Isolation (installs services on the runner)
    runs-on: windows-2025
    needs: [go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fetch and verify cloudflared (S-71)
        shell: pwsh
        run: ./build/fetch-cloudflared.ps1
      - name: Build release binary
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -tags production,cloudflared -o bin/soireehost.exe ./cmd/soireehost
      - name: Copy the binary to a folder only administrators can change
        # setup refuses to install from a folder another account could change
        # (DR-9), and the checkout folder's permissions are the runner's
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\soireehost-ci | Out-Null
          icacls C:\soireehost-ci /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item bin\soireehost.exe C:\soireehost-ci\soireehost.exe
      - name: setup install
        run: C:\soireehost-ci\soireehost.exe setup install
      - name: Isolation and tunnel tests
        env:
          SOIREEHOST_E2E: "1"
          # Phase 3 phone check, only when a run is started by hand for it
          SOIREEHOST_PHONE_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.phone_minutes || '0' }}
        shell: pwsh
        run: |
          $out = go test -tags e2e -count=1 -v -timeout 60m ./internal/e2e/ 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) {
            $lines = $out -split "`r?`n" | Where-Object { $_ -match 'FAIL|panic|error|--- |\.go:\d+' } | Select-Object -First 40
            $msg = ($lines -join '%0A') -replace '::', ': :'
            Write-Output "::error title=isolation tests failed::$msg"
            exit $code
          }
      - name: setup install again over the running install (repair)
        shell: pwsh
        run: |
          C:\soireehost-ci\soireehost.exe setup install
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=reinstall::setup install failed over an existing install"; exit 1 }
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline) {
            $down = Get-Service SoireeHost, SoireeHostWeb, SoireeHostTunnel | Where-Object Status -ne 'Running'
            if (-not $down) { exit 0 }
            Start-Sleep -Seconds 2
          }
          Write-Output "::error title=reinstall::services not running 90 seconds after reinstall"
          exit 1
      - name: Service state on failure
        if: failure()
        shell: pwsh
        run: |
          $s = Get-Service SoireeHost* | Format-Table Name, Status, StartType -AutoSize | Out-String
          Write-Output $s
          Write-Output "::error title=service state::$(($s -split "`r?`n" | Where-Object { $_ }) -join '%0A')"
          # the services' own messages, and the service manager's
          $ev = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'SoireeHost', 'SoireeHostWeb', 'SoireeHostTunnel' } -MaxEvents 20 -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.TimeCreated.ToString('HH:mm:ss')) $($_.ProviderName): $($_.Message)" }
          $scm = Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager' } -MaxEvents 50 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'SoireeHost|Soir' } | Select-Object -First 10 |
            ForEach-Object { "$($_.TimeCreated.ToString('HH:mm:ss')) SCM $($_.Id): $($_.Message)" }
          $all = @($ev) + @($scm) | Where-Object { $_ }
          Write-Output ($all -join "`n")
          $msg = (($all | ForEach-Object { $_ -replace "`r?`n", ' ' }) -join '%0A') -replace '::', ': :'
          if ($msg) { Write-Output "::error title=service events::$msg" }
      - name: setup uninstall --purge
        if: always()
        run: C:\soireehost-ci\soireehost.exe setup uninstall --purge
      - name: Uninstall left nothing behind
        if: always()
        shell: pwsh
        run: |
          $left = @()
          if (Get-Service SoireeHost* -ErrorAction SilentlyContinue) { $left += "services" }
          if (Test-Path "$env:ProgramFiles\SoireeHost") { $left += "program folder" }
          if (Test-Path "$env:ProgramData\SoireeHost") { $left += "data folder" }
          if (Get-NetFirewallRule -DisplayName "SoireeHost block inbound *" -ErrorAction SilentlyContinue) { $left += "firewall rules" }
          if (Get-Process cloudflared -ErrorAction SilentlyContinue) { $left += "cloudflared process" }
          if ($left) { Write-Output "::error title=uninstall left::$($left -join ', ')"; exit 1 }

  fuzz:
    name: Fuzz (nightly, 10 minutes per target)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run every fuzz target
        shell: pwsh
        run: ./build/fuzz.ps1 -Duration 10m
