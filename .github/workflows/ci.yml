# Build, lint, test and scan on every push and pull request; deeper runs nightly.
# Every action is pinned to a full commit SHA (S-72); the tag is in the comment.
# Pull-request builds get no secrets and a read-only token (S-72).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      phone_minutes:
        description: "Phase 3 phone check: keep a quick share link up for this many minutes (0 = off, at most 30). The link is printed as a notice on the run page."
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  # no_fs_access keeps Coraza from writing request bodies to temp files;
  # internal/waf does not compile without it (ADR-0008). A step that sets
  # its own -tags must list it too.
  GOFLAGS: -mod=readonly -tags=no_fs_access
  NODE_VERSION: "26"
  WAILS_VERSION: v3.1.0
  GOLANGCI_LINT_VERSION: v2.15.0
  STATICCHECK_VERSION: v0.8.2
  GOSEC_VERSION: v2.30.0
  GOVULNCHECK_VERSION: v1.9.0
  GITLEAKS_VERSION: v8.30.1
  SEMGREP_VERSION: "1.185.0"

jobs:
  go:
    name: Go checks
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify module checksums
        run: go mod verify
      - name: Vendored Core Rule Set matches its signed release (S-71, ADR-0008)
        shell: pwsh
        run: ./build/check-crs.ps1
      - name: go vet
        run: go vet ./...
      - name: Tests with race detector
        # The race detector needs cgo; release builds stay CGO_ENABLED=0.
        # On failure the relevant lines are also published as an annotation,
        # which GitHub shows without signing in (job logs need a sign-in).
        env:
          CGO_ENABLED: "1"
        shell: pwsh
        run: |
          $out = go test -race -count=1 ./... 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) {
            $lines = $out -split "`r?`n" | Where-Object { $_ -match 'FAIL|panic|WARNING: DATA RACE|error|cannot|undefined|--- |\.go:\d+' } | Select-Object -First 40
            $msg = ($lines -join '%0A') -replace '::', ': :'
            Write-Output "::error title=go test -race failed::$msg"
            exit $code
          }
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: golangci-lint (installed-system tests)
        # internal/e2e builds only with the e2e tag; --build-tags replaces the
        # config's list, so no_fs_access is named again (ADR-0008)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --build-tags no_fs_access,e2e ./internal/e2e/...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }} -tags no_fs_access ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }} -quiet -tags no_fs_access -exclude-dir=.semgrep ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} -tags no_fs_access ./...

  frontend:
    name: Frontend checks
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install (no install scripts)
        run: npm ci --ignore-scripts --no-fund
      - name: Type check
        run: npm run check
      - name: Lint (includes S-34 rules)
        run: npm run lint
      - name: Tests
        run: npm test
      - name: npm audit
        # Low-severity findings are reviewed in docs/DEPENDENCIES.md.
        run: npm audit --audit-level=moderate

  build:
    name: Build soireehost.exe
    runs-on: windows-2025
    timeout-minutes: 30
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
        env:
          GOFLAGS: ""
      - name: Build (with the pinned cloudflared, S-71)
        shell: pwsh
        run: ./build/build.ps1 -SkipChecks -Cloudflared
      - name: Committed bindings match the Go code
        run: git diff --exit-code -- frontend/bindings
      - name: Binary has ASLR, DEP and high-entropy VA (S-24)
        run: go run ./build/pecheck bin/soireehost.exe

  secrets:
    name: Secret scan
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gitleaks (full history)
        env:
          GOFLAGS: ""
        run: |
          go install github.com/zricethezav/gitleaks/v8@${{ env.GITLEAKS_VERSION }}
          gitleaks git --redact --no-banner -v .

  semgrep:
    # The project's own rules in .semgrep (plan section 10): S-01, S-34, S-40,
    # R-14 and CLAUDE.md rule 6. Semgrep runs offline with metrics off; no
    # login, token or cloud platform is used.
    name: Semgrep (project rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Semgrep
        # pipx ships on the runner image, so no extra action is needed (the
        # repository allow list does not include actions/setup-python).
        run: pipx install semgrep==${{ env.SEMGREP_VERSION }}
      - name: Rule tests
        run: semgrep --test --metrics=off .semgrep
      - name: Scan with the project rules
        # The rule folders hold the rules' own test cases, which are meant to
        # match, so they are left out of the scan.
        run: semgrep scan --metrics=off --config .semgrep --error --exclude=.semgrep

  isolation:
    # Installs the three services on this throwaway runner (which has
    # administrator rights) and checks isolation from the outside: plan
    # Phase 2, docs/TEST_PLAN.md "Isolation". Never run on a developer PC.
    name: Isolation (installs services on the runner)
    runs-on: windows-2025
    timeout-minutes: 90
    needs: [go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fetch and verify cloudflared (S-71)
        shell: pwsh
        run: ./build/fetch-cloudflared.ps1
      - name: Build release binary
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -tags production,cloudflared,no_fs_access -o bin/soireehost.exe ./cmd/soireehost
      - name: Copy the binary to a folder only administrators can change
        # setup refuses to install from a folder another account could change
        # (DR-9), and the checkout folder's permissions are the runner's
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\soireehost-ci | Out-Null
          icacls C:\soireehost-ci /inheritance:r /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item bin\soireehost.exe C:\soireehost-ci\soireehost.exe
      - name: setup install
        run: C:\soireehost-ci\soireehost.exe setup install
      - name: Isolation and tunnel tests
        env:
          SOIREEHOST_E2E: "1"
        shell: pwsh
        run: |
          $out = go test -tags e2e,no_fs_access -count=1 -v -timeout 60m ./internal/e2e/ 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) {
            $lines = $out -split "`r?`n" | Where-Object { $_ -match 'FAIL|panic|error|--- |\.go:\d+' } | Select-Object -First 40
            $msg = ($lines -join '%0A') -replace '::', ': :'
            Write-Output "::error title=isolation tests failed::$msg"
            exit $code
          }
      - name: Phone check, open the quick share (only when started by hand with phone_minutes)
        # Phase 3: the link is printed when this step ends, while the share
        # is still up; the next step keeps it up
        if: github.event_name == 'workflow_dispatch' && inputs.phone_minutes != '0'
        env:
          SOIREEHOST_E2E: "1"
          SOIREEHOST_PHONE_MINUTES: ${{ inputs.phone_minutes }}
        run: go test -tags e2e,no_fs_access -count=1 -v -timeout 10m -run '^TestPhoneCheck$' ./internal/e2e/
      - name: Phone check, keep the quick share up
        if: github.event_name == 'workflow_dispatch' && inputs.phone_minutes != '0'
        env:
          MINUTES: ${{ inputs.phone_minutes }}
        shell: pwsh
        run: |
          $m = [Math]::Min([Math]::Max([int]$env:MINUTES, 1), 30)
          Write-Output "Keeping the quick share up for $m minutes"
          Start-Sleep -Seconds (60 * $m)
      - name: setup install again over the running install (repair)
        shell: pwsh
        run: |
          C:\soireehost-ci\soireehost.exe setup install
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=reinstall::setup install failed over an existing install"; exit 1 }
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline) {
            $down = Get-Service SoireeHost, SoireeHostWeb, SoireeHostTunnel | Where-Object Status -ne 'Running'
            if (-not $down) { exit 0 }
            Start-Sleep -Seconds 2
          }
          Write-Output "::error title=reinstall::services not running 90 seconds after reinstall"
          exit 1
      - name: setup repair from the installed program (ADR-0010)
        shell: pwsh
        run: |
          & "$env:ProgramFiles\SoireeHost\soireehost.exe" setup repair | Out-Default
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=repair::setup repair exited $LASTEXITCODE"; exit 1 }
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline) {
            $down = Get-Service SoireeHost, SoireeHostWeb, SoireeHostTunnel | Where-Object Status -ne 'Running'
            if (-not $down) { exit 0 }
            Start-Sleep -Seconds 2
          }
          Write-Output "::error title=repair::services not running 90 seconds after repair"
          exit 1
      - name: Update tests (S-60 to S-64, ADR-0004, ADR-0010)
        # Builds test versions that trust a key made here and now
        # (updatetestkey; never a release build), installs 1.0.0 over the
        # install above, and runs TestApplyUpdate against it
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          $d = 'C:\soireehost-ci\upd'
          New-Item -ItemType Directory -Force $d | Out-Null
          [IO.File]::WriteAllText("$PWD\internal\update\testkey.json", '{"keys":[]}')
          go run ./build/updatekey gen -out C:\soireehost-ci\update-test.key -keys internal/update/testkey.json
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=update tests::could not make the test key"; exit 1 }
          $builds = @(
            @{ v = '1.0.0'; extra = ',setuptesthooks'; name = '1.0.0.exe' },
            @{ v = '1.1.0'; extra = ',setuptesthooks'; name = '1.1.0.exe' },
            @{ v = '1.2.0'; extra = ',updatetestfail'; name = '1.2.0-fail.exe' },
            @{ v = '1.2.0'; extra = ''; name = '1.2.0.exe' }
          )
          foreach ($b in $builds) {
            go build -trimpath -tags "cloudflared,no_fs_access,updatetestkey$($b.extra)" -ldflags "-X github.com/TheAlsaadi/SoireeHost/internal/version.Version=$($b.v)" -o "$d\$($b.name)" ./cmd/soireehost
            if ($LASTEXITCODE -ne 0) { Write-Output "::error title=update tests::building $($b.name) failed"; exit 1 }
          }
          & "$d\1.0.0.exe" setup install | Out-Default
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=update tests::installing the 1.0.0 test build exited $LASTEXITCODE"; exit 1 }
          $env:SOIREEHOST_E2E = '1'
          $env:SOIREEHOST_UPDATE_E2E = '1'
          $env:SOIREEHOST_UPDATE_KEY = 'C:\soireehost-ci\update-test.key'
          $out = go test -tags e2e,no_fs_access -count=1 -v -timeout 30m -run '^TestApplyUpdate$' ./internal/e2e/ 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) {
            $lines = $out -split "`r?`n" | Where-Object { $_ -match 'FAIL|panic|error|exited|--- |\.go:\d+' } | Select-Object -First 40
            $msg = ($lines -join '%0A') -replace '::', ': :'
            Write-Output "::error title=update tests failed::$msg"
            exit $code
          }
      - name: Signed update tests (S-61, ADR-0004)
        # Two throwaway code-signing certificates, trusted on this runner
        # only, sign test builds; TestSignedUpdates then checks that a signed
        # install refuses an unsigned update and another publisher's
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          $d = 'C:\soireehost-ci\upd\signed'
          New-Item -ItemType Directory -Force $d | Out-Null
          foreach ($v in '1.3.0', '1.4.0') {
            go build -trimpath -tags "cloudflared,no_fs_access,updatetestkey" -ldflags "-X github.com/TheAlsaadi/SoireeHost/internal/version.Version=$v" -o "$d\$v.exe" ./cmd/soireehost
            if ($LASTEXITCODE -ne 0) { Write-Output "::error title=signed update tests::building $v failed"; exit 1 }
          }
          $certs = @{}
          foreach ($who in 'A', 'B') {
            $c = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=SoireeHost Test Signer $who" -CertStoreLocation Cert:\LocalMachine\My -NotAfter (Get-Date).AddDays(1)
            foreach ($store in 'Root', 'TrustedPublisher') {
              $s = [System.Security.Cryptography.X509Certificates.X509Store]::new($store, 'LocalMachine')
              $s.Open('ReadWrite'); $s.Add($c); $s.Close()
            }
            $certs[$who] = $c
          }
          foreach ($job in @(@{ src = '1.3.0.exe'; dst = '1.3.0-a.exe'; who = 'A' }, @{ src = '1.4.0.exe'; dst = '1.4.0-a.exe'; who = 'A' }, @{ src = '1.4.0.exe'; dst = '1.4.0-b.exe'; who = 'B' })) {
            Copy-Item "$d\$($job.src)" "$d\$($job.dst)"
            $r = Set-AuthenticodeSignature -FilePath "$d\$($job.dst)" -Certificate $certs[$job.who] -HashAlgorithm SHA256
            if ($r.Status -ne 'Valid') { Write-Output "::error title=signed update tests::signing $($job.dst): $($r.Status) $($r.StatusMessage)"; exit 1 }
          }
          $env:SOIREEHOST_E2E = '1'
          $env:SOIREEHOST_SIGNED_E2E = '1'
          $env:SOIREEHOST_UPDATE_KEY = 'C:\soireehost-ci\update-test.key'
          $out = go test -tags e2e,no_fs_access -count=1 -v -timeout 20m -run '^TestSignedUpdates$' ./internal/e2e/ 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) {
            $lines = $out -split "`r?`n" | Where-Object { $_ -match 'FAIL|panic|error|exited|--- |\.go:\d+' } | Select-Object -First 40
            $msg = ($lines -join '%0A') -replace '::', ': :'
            Write-Output "::error title=signed update tests failed::$msg"
            exit $code
          }
      - name: Service state on failure
        if: failure()
        shell: pwsh
        run: |
          $s = Get-Service SoireeHost* | Format-Table Name, Status, StartType -AutoSize | Out-String
          Write-Output $s
          Write-Output "::error title=service state::$(($s -split "`r?`n" | Where-Object { $_ }) -join '%0A')"
          # the services' own messages, and the service manager's
          $ev = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'SoireeHost', 'SoireeHostWeb', 'SoireeHostTunnel' } -MaxEvents 20 -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.TimeCreated.ToString('HH:mm:ss')) $($_.ProviderName): $($_.Message)" }
          $scm = Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager' } -MaxEvents 50 -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'SoireeHost|Soir' } | Select-Object -First 10 |
            ForEach-Object { "$($_.TimeCreated.ToString('HH:mm:ss')) SCM $($_.Id): $($_.Message)" }
          $all = @($ev) + @($scm) | Where-Object { $_ }
          Write-Output ($all -join "`n")
          $msg = (($all | ForEach-Object { $_ -replace "`r?`n", ' ' }) -join '%0A') -replace '::', ': :'
          if ($msg) { Write-Output "::error title=service events::$msg" }
          # the tunnel launcher's log (scrubbed of the token before it was
          # written; the test token is a made-up one in any case)
          $tl = "$env:ProgramData\SoireeHost\logs\tunnel\cloudflared.log"
          if (Test-Path $tl) {
            $tail = Get-Content $tl -Tail 40
            Write-Output ($tail -join "`n")
            $tmsg = (($tail | Select-Object -Last 15) -join '%0A') -replace '::', ': :'
            Write-Output "::error title=tunnel log::$tmsg"
          }
      - name: setup uninstall --purge
        if: always()
        run: C:\soireehost-ci\soireehost.exe setup uninstall --purge
      - name: Uninstall left nothing behind
        if: always()
        shell: pwsh
        run: |
          $left = @()
          if (Get-Service SoireeHost* -ErrorAction SilentlyContinue) { $left += "services" }
          if (Test-Path "$env:ProgramFiles\SoireeHost") { $left += "program folder" }
          if (Test-Path "$env:ProgramData\SoireeHost") { $left += "data folder" }
          if (Get-NetFirewallRule -DisplayName "SoireeHost block inbound *" -ErrorAction SilentlyContinue) { $left += "firewall rules" }
          if (Get-Process cloudflared -ErrorAction SilentlyContinue) { $left += "cloudflared process" }
          if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\SoireeHost') { $left += "Apps entry" }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name SoireeHost -ErrorAction SilentlyContinue) { $left += "sign-in entry" }
          if ($left) { Write-Output "::error title=uninstall left::$($left -join ', ')"; exit 1 }

  fuzz:
    name: Fuzz (nightly, 10 minutes per target)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run every fuzz target
        shell: pwsh
        run: ./build/fuzz.ps1 -Duration 10m
